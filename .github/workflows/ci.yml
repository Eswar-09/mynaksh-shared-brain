name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/mynaksh-dev
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p mynaksh-dev 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_PASSWORD: mynaksh-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.8.4
      - run: ruff check mynaksh tests --select F,E9,B
      - run: pytest -q
